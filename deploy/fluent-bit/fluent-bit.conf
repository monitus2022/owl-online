# Fluent Bit ships the API container logs to S3 continuously.
#
# Run it on the host with --log-driver=none so it never tails its own output:
#   docker run -d --name owl-logs --restart unless-stopped \
#     --log-driver=none \
#     -e LOG_BUCKET -e AWS_REGION \
#     -v /var/lib/docker/containers:/var/lib/docker/containers:ro \
#     -v /var/lib/owl/fluent-bit:/var/lib/owl/fluent-bit \
#     -v "$PWD/fluent-bit.conf:/fluent-bit/etc/fluent-bit.conf:ro" \
#     fluent/fluent-bit:3.1
#
# The app container keeps its json-file logs with rotation, so `docker logs`
# still works locally. This process only copies them onward.

[SERVICE]
    flush 5
    grace 30
    log_level info
    storage.path /var/lib/owl/fluent-bit
    storage.sync normal
    storage.checksum off

[INPUT]
    name tail
    path /var/lib/docker/containers/*/*-json.log
    parser docker
    tag owl.api
    read_from_head false
    refresh_interval 5
    mem_buf_limit 32MB
    storage.type filesystem
    # Docker rotates the file; follow renamed files until they age out.
    path_key source_file

[OUTPUT]
    name s3
    match owl.api
    bucket ${LOG_BUCKET}
    region ${AWS_REGION}
    s3_key_format /owl-online/%Y/%m/%d/%H/%M/$TAG/$UUID
    total_file_size 5M
    upload_timeout 30s
    upload_chunk_size 2M
    compression gzip
    use_put_object On
    json_date_key date
    json_date_format iso8601
    storage.total_limit_size 512M
