# Minimal deploy pipeline for V1 (#52): build the image, push to ECR, roll it
# out on the EC2 instance over SSM. No tests and no data pipeline here - the
# corpus and index are a one-time upload to the host, not part of CI. The full
# pipeline (ECS, gated tests) stays in #37.
#
# Requires repo secrets: AWS_ACCESS_KEY_ID, AWS_SECRET_ACCESS_KEY (the
# monitus-companion IAM user). See docs/deploy.md for the one-time host setup.

name: deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-main
  cancel-in-progress: false

env:
  AWS_REGION: ap-northeast-3
  ECR_REPOSITORY: owl-online
  INSTANCE_ID: i-0bd80b876b2c1ab56
  CONTAINER_NAME: owl-online
  # nginx terminates TLS on 80/443 (Cloudflare Full strict) and proxies here.
  HOST_PORT: "127.0.0.1:8000"
  ENV_FILE: /home/ec2-user/owl.env
  DATA_DIR: /data
  # Non-secret lesson/persona toggles. Set repository variables to override;
  # `-e` takes precedence over the host env file for these keys.
  OWL_SUBJECTS_PATH: ${{ vars.OWL_SUBJECTS_PATH || '/data/subjects' }}
  OWL_LESSON_MODE: ${{ vars.OWL_LESSON_MODE || 'false' }}
  OWL_PERSONA: ${{ vars.OWL_PERSONA || 'false' }}

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      image: ${{ steps.meta.outputs.image }}
    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Ensure the ECR repository exists
        run: |
          aws ecr describe-repositories --repository-names "$ECR_REPOSITORY" >/dev/null 2>&1 \
            || aws ecr create-repository --repository-name "$ECR_REPOSITORY" >/dev/null

      - name: Log in to ECR
        id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and push the image
        id: meta
        run: |
          image="${{ steps.ecr.outputs.registry }}/$ECR_REPOSITORY"
          docker build -t "$image:$GITHUB_SHA" -t "$image:latest" .
          docker push "$image:$GITHUB_SHA"
          docker push "$image:latest"
          echo "image=$image:$GITHUB_SHA" >> "$GITHUB_OUTPUT"

  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Roll out on the instance over SSM
        env:
          IMAGE: ${{ needs.build-and-push.outputs.image }}
        run: |
          set -euo pipefail

          # Placeholders are substituted below, so the instance runs a plain
          # script with no workflow context in it.
          SCRIPT=$(cat <<'EOS'
          set -euo pipefail
          aws ecr get-login-password --region __REGION__ \
            | docker login --username AWS --password-stdin __REGISTRY__
          # The root volume is small and /data shares it. Pull first: if it fits
          # (~215 MB to download, ~590 MB on disk), the old version kept serving
          # the whole time. Only on failure evict the running container and unused
          # images, then retry (that retry is the only window where a failure
          # leaves the service down).
          if ! docker pull __IMAGE__; then
            docker rm -f __NAME__ >/dev/null 2>&1 || true
            docker image prune -af >/dev/null
            docker pull __IMAGE__
          fi
          docker rm -f __NAME__ >/dev/null 2>&1 || true
          docker run -d --name __NAME__ --restart unless-stopped \
            --log-driver json-file --log-opt max-size=10m --log-opt max-file=3 \
            -p __HOST_PORT__:8000 \
            --env-file __ENV_FILE__ \
            -e OWL_SUBJECTS_PATH="__OWL_SUBJECTS_PATH__" \
            -e OWL_LESSON_MODE="__OWL_LESSON_MODE__" \
            -e OWL_PERSONA="__OWL_PERSONA__" \
            -v __DATA_DIR__:/data \
            __IMAGE__
          for i in $(seq 1 30); do
            if docker exec __NAME__ python -c "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8000/health', timeout=2).status==200 else 1)" 2>/dev/null; then
              echo "healthy after $i tries"
              # Drop the previous image now that the new container is up.
              docker image prune -af >/dev/null
              exit 0
            fi
            sleep 2
          done
          echo "health check failed" >&2
          docker logs --tail 50 __NAME__ >&2 || true
          exit 1
          EOS
          )
          REGISTRY="${IMAGE%%/*}"
          SCRIPT="${SCRIPT//__REGION__/$AWS_REGION}"
          SCRIPT="${SCRIPT//__REGISTRY__/$REGISTRY}"
          SCRIPT="${SCRIPT//__IMAGE__/$IMAGE}"
          SCRIPT="${SCRIPT//__NAME__/$CONTAINER_NAME}"
          SCRIPT="${SCRIPT//__HOST_PORT__/$HOST_PORT}"
          SCRIPT="${SCRIPT//__ENV_FILE__/$ENV_FILE}"
          SCRIPT="${SCRIPT//__DATA_DIR__/$DATA_DIR}"
          SCRIPT="${SCRIPT//__OWL_SUBJECTS_PATH__/$OWL_SUBJECTS_PATH}"
          SCRIPT="${SCRIPT//__OWL_LESSON_MODE__/$OWL_LESSON_MODE}"
          SCRIPT="${SCRIPT//__OWL_PERSONA__/$OWL_PERSONA}"

          jq -n --arg c "$SCRIPT" '{commands: [$c]}' > /tmp/ssm-params.json
          command_id=$(aws ssm send-command \
            --document-name AWS-RunShellScript \
            --instance-ids "$INSTANCE_ID" \
            --parameters file:///tmp/ssm-params.json \
            --query 'Command.CommandId' --output text)
          echo "SSM command: $command_id"

          status=Pending
          for _ in $(seq 1 60); do
            status=$(aws ssm get-command-invocation --command-id "$command_id" \
              --instance-id "$INSTANCE_ID" --query 'Status' --output text 2>/dev/null || echo Pending)
            case "$status" in
              Success|Cancelled|TimedOut|Failed) break ;;
            esac
            sleep 5
          done

          aws ssm get-command-invocation --command-id "$command_id" \
            --instance-id "$INSTANCE_ID" \
            --query '{Status:Status,Stdout:StandardOutputContent,Stderr:StandardErrorContent}' \
            --output json
          [ "$status" = "Success" ]
