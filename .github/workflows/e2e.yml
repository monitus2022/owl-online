# Browser E2E and accessibility checks (#179).
#
# The suite runs the real FastAPI app with an injected stub runtime and the
# real Vite frontend; the corpus, index and pack prose stay out of git. The
# load check is manual/release-only and is not part of this workflow.

name: e2e

on:
  pull_request:
  workflow_dispatch:

jobs:
  browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install uv
        run: pip install uv

      - name: Install the API dependencies
        run: uv sync

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install the frontend
        run: npm ci --prefix web

      - name: Install the E2E dependencies
        run: npm ci --prefix e2e

      - name: Install Chromium
        working-directory: e2e
        run: npx playwright install --with-deps chromium

      - name: Run the student loop and axe checks
        working-directory: e2e
        run: npm test

      - name: Upload the Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: e2e/playwright-report
          retention-days: 7
