# Rollout guard for #214.
#
# The deploy workflow normally creates `build-and-push` and `deploy`. On
# 2026-11-09 a run completed `build-and-push` but GitHub never created the
# `deploy` job, so the old container kept serving and the run still looked like
# a success. This guard runs after the deploy workflow and fails when the
# `deploy` job is missing or did not succeed, so a silent non-rollout is a red
# check instead of a green build.

name: deploy-guard

on:
  workflow_run:
    workflows: ["deploy"]
    types: [completed]

permissions:
  actions: read
  contents: read

jobs:
  verify-rollout:
    if: >-
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch == 'main'
    runs-on: ubuntu-latest
    steps:
      - name: Check the rollout job exists and succeeded
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ github.event.workflow_run.id }}
          CONCLUSION: ${{ github.event.workflow_run.conclusion }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          if [ "$CONCLUSION" != "success" ]; then
            echo "::error::deploy run $RUN_ID concluded $CONCLUSION"
            exit 1
          fi
          jobs=$(gh api "repos/$REPO/actions/runs/$RUN_ID/jobs" \
            --paginate --jq '.jobs[] | "\(.name) \(.conclusion)"')
          echo "$jobs"
          if ! printf '%s\n' "$jobs" | grep -qx 'deploy success'; then
            echo "::error::deploy run $RUN_ID has no successful deploy job"
            exit 1
          fi
          echo "rollout job present and successful"
