# Rollout guard for #214.
#
# The deploy workflow normally creates `build-and-push` and `deploy`. On
# 2026-11-09 run 42671829253 concluded `failure` with no jobs at all, and the
# manual-dispatch run 42673727721 concluded `failure` with only
# `build-and-push`; the old container kept serving. This guard runs after the
# deploy workflow. The conclusion check fails a failed run, and the job check
# fails a future run that concludes success but has no successful `deploy`
# job, so a silent non-rollout is a red check.

name: deploy-guard

on:
  workflow_run:
    workflows: ["deploy"]
    types: [completed]

permissions:
  actions: read
  contents: read

jobs:
  verify-rollout:
    if: >-
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch == 'main'
    runs-on: ubuntu-latest
    steps:
      - name: Check the rollout job exists and succeeded
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ github.event.workflow_run.id }}
          CONCLUSION: ${{ github.event.workflow_run.conclusion }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          if [ "$CONCLUSION" != "success" ]; then
            echo "::error::deploy run $RUN_ID concluded $CONCLUSION"
            exit 1
          fi
          jobs=$(gh api "repos/$REPO/actions/runs/$RUN_ID/jobs" \
            --paginate --jq '.jobs[] | "\(.name) \(.conclusion)"')
          echo "$jobs"
          if ! printf '%s\n' "$jobs" | grep -qx 'deploy success'; then
            echo "::error::deploy run $RUN_ID has no successful deploy job"
            exit 1
          fi
          echo "rollout job present and successful"
