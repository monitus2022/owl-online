# Eval gate: the pinned baseline and the largest allowed drop per metric.
#
# `scripts/run_eval.py --check` fails when a gated metric falls more than its
# band below the baseline. Bands are absolute, not relative: 0.05 means five
# points. `[slice_bands]` overrides `[bands]` for named slices because the small
# slices move in large steps: one item is 0.125 on the 8-item retrieval slices
# and 0.20 on the 5-item generation slices.

baseline = "eval/results/baseline.csv"

[bands]
hit_at_k = 0.05
recall_at_k = 0.05
mrr = 0.05
f1 = 0.05
faithfulness_rate = 0.10
judge_correct_rate = 0.10
abstention_rate = 0.0
retrieval_n = 0.0
generation_n = 0.0
abstention_n = 0.0

[slice_bands]
hit_at_k = 0.13
recall_at_k = 0.13
mrr = 0.13
f1 = 0.13
faithfulness_rate = 0.20
judge_correct_rate = 0.20
abstention_rate = 0.0
retrieval_n = 0.0
generation_n = 0.0
abstention_n = 0.0
