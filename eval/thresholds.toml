# Eval gate: the pinned baseline and the largest allowed drop per metric.
#
# `scripts/run_eval.py --check` fails when a gated metric falls further than its
# band below the baseline. Bands are absolute. For rate metrics the effective
# band is max(base, 1/n) for that slice, so one item is always allowed and a
# small slice cannot fail on a single flip. Count metrics use the base band
# directly, normally zero, so a gold-set or sample change cannot hide inside an
# average.

baseline = "eval/results/baseline.csv"

[bands]
hit_at_k = 0.05
recall_at_k = 0.05
mrr = 0.05
f1 = 0.05
faithfulness_rate = 0.10
judge_correct_rate = 0.10
abstention_rate = 0.0
retrieval_n = 0.0
generation_n = 0.0
abstention_n = 0.0
abstention_refused = 0.0
answered = 0.0
abstained = 0.0
faithfulness_n = 0.0
faithful = 0.0
judge_correct = 0.0
judge_partial = 0.0
judge_wrong = 0.0
grounded = 0.0
judge_parse_failures = 0.0
faithful_parse_failures = 0.0
