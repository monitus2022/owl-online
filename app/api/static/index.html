<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="owl-api-base" content="" />
    <title>O.W.L. Online</title>
    <style>
      :root {
        color-scheme: light dark;
        --line: #8884;
      }
      body {
        font-family: system-ui, sans-serif;
        margin: 0 auto;
        max-width: 46rem;
        padding: 2rem 1rem;
        line-height: 1.5;
      }
      h1 {
        font-size: 1.4rem;
      }
      form {
        display: flex;
        gap: 0.5rem;
      }
      input {
        flex: 1;
        padding: 0.6rem;
        font-size: 1rem;
      }
      button {
        padding: 0.6rem 1rem;
        font-size: 1rem;
      }
      #result {
        margin-top: 1.5rem;
        border-top: 1px solid var(--line);
        padding-top: 1rem;
      }
      #citations {
        list-style: none;
        display: flex;
        flex-wrap: wrap;
        gap: 0.4rem;
        padding: 0;
      }
      #citations li {
        border: 1px solid var(--line);
        border-radius: 999px;
        padding: 0.1rem 0.6rem;
        font-size: 0.85rem;
        font-family: ui-monospace, monospace;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>O.W.L. Online</h1>
      <p>Ask a question; answers are grounded in the books and cite their sources.</p>
      <form id="ask-form">
        <input
          id="question"
          name="question"
          placeholder="Ask about the books"
          autocomplete="off"
          required
        />
        <button type="submit">Ask</button>
      </form>
      <section id="result" hidden>
        <p id="answer"></p>
        <ul id="citations"></ul>
      </section>
    </main>
    <script>
      const form = document.getElementById("ask-form");
      const result = document.getElementById("result");
      const answerEl = document.getElementById("answer");
      const citationsEl = document.getElementById("citations");
      // Empty base means same origin (served by the API). Set the meta tag to
      // the live API URL when hosting this page separately, e.g. Cloudflare Pages.
      const apiBase = document
        .querySelector('meta[name="owl-api-base"]')
        .content.replace(/\/$/, "");

            form.addEventListener("submit", async (event) => {
        event.preventDefault();
        const question = document.getElementById("question").value;
        result.hidden = false;
        citationsEl.replaceChildren();
        answerEl.textContent = "Thinking...";
        let draft = "";
        try {
          const response = await fetch(`${apiBase}/ask/stream`, {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ question }),
          });
          if (!response.ok || !response.body) {
            answerEl.textContent = "Please enter a question and try again.";
            return;
          }
          const reader = response.body.getReader();
          const decoder = new TextDecoder();
          let buffer = "";
          while (true) {
            const { value, done } = await reader.read();
            if (done) break;
            buffer += decoder.decode(value, { stream: true });
            const frames = buffer.split(/\r?\n\r?\n/);
            buffer = frames.pop();
            for (const frame of frames) {
              let name = "message";
              let data = "";
              for (const line of frame.split(/\r?\n/)) {
                if (line.startsWith("event: ")) name = line.slice(7).trim();
                else if (line.startsWith("data: ")) data += line.slice(6);
              }
              if (!data) continue;
              const payload = JSON.parse(data);
              if (name === "token") {
                draft += payload.text;
                answerEl.textContent = draft;
              } else if (name === "reset") {
                draft = "";
                answerEl.textContent = "Checking grounding...";
              } else if (name === "final") {
                answerEl.textContent = payload.answer;
                citationsEl.replaceChildren();
                for (const id of payload.citations) {
                  const li = document.createElement("li");
                  li.textContent = id;
                  citationsEl.appendChild(li);
                }
              } else if (name === "error") {
                answerEl.textContent = payload.detail;
              }
            }
          }
        } catch (error) {
          answerEl.textContent = "Could not reach the server.";
        }
      });
    </script>
  </body>
</html>
