[project]
name = "owl-online"
version = "0.1.0"
description = "Grounded, agentic RAG revision tool: revision chat, exam generation, grading."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi",
    "uvicorn[standard]",
    "pydantic",
    "pydantic-settings",
    "httpx",
    "chromadb",
    "rank-bm25",
    "numpy",
    "boto3",
    "openai",
    "python-dotenv",
    "langgraph",
    "sse-starlette",
]

[tool.uv]
package = false
python-preference = "only-managed"
default-groups = ["dev", "ingest"]
exclude-dependencies = ["kubernetes", "onnxruntime"]

[dependency-groups]
dev = [
    "pytest",
    "pytest-asyncio",
    "ruff",
    "mypy",
    "ipykernel",
]
ingest = ["pymupdf"]

[tool.pytest.ini_options]
testpaths = ["tests", "eval"]
addopts = "-q"
asyncio_mode = "auto"
pythonpath = ["."]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.12"

# These ship no type stubs or py.typed marker; treat them as untyped.
[[tool.mypy.overrides]]
module = ["rank_bm25.*", "boto3.*", "botocore.*"]
ignore_missing_imports = true
