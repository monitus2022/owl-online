[project]
name = "owl-online"
version = "0.1.0"
description = "Grounded, agentic RAG revision tool: revision chat, exam generation, grading."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi",
    "uvicorn[standard]",
    "sse-starlette",
    "pydantic",
    "pydantic-settings",
    "httpx",
    "langgraph",
    "chromadb",
    "rank-bm25",
    "numpy",
    "boto3",
    "openai",
    "tenacity",
]

# Served as an application only. Never published, so uv does not build or
# install the project itself; `uv run` resolves imports from the project root.
# Prefer uv-managed interpreters: the host is arm64 and some deps (onnxruntime)
# ship no x86_64-macOS wheel.
[tool.uv]
package = false
python-preference = "only-managed"

[dependency-groups]
dev = [
    "pytest",
    "pytest-asyncio",
    "ruff",
    "mypy",
    "ipykernel",
]

[tool.pytest.ini_options]
testpaths = ["tests", "eval"]
addopts = "-q"
asyncio_mode = "auto"
pythonpath = ["."]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.12"
