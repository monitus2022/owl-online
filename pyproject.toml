[project]
name = "owl-online"
version = "0.1.0"
description = "Grounded, agentic RAG revision tool: revision chat, exam generation, grading."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi",
    "uvicorn[standard]",
    "pydantic",
    "pydantic-settings",
    "httpx",
    "chromadb",
    "rank-bm25",
    "numpy",
    "boto3",
    "openai",
    "python-dotenv"
]

# Served as an application only. Never published, so uv does not build or
# install the project itself; `uv run` resolves imports from the project root.
# Prefer uv-managed interpreters: the host is arm64 and some deps (onnxruntime)
# ship no x86_64-macOS wheel.
[tool.uv]
package = false
python-preference = "only-managed"
# Local-only and V2 deps are groups, not base deps. `uv sync` installs these by
# default (same dev environment as before); the runtime image syncs with
# --no-default-groups and gets only [project] dependencies.
default-groups = ["dev", "ingest", "agent"]
# chromadb pulls these for its distributed mode and its default embedder, neither
# of which we use (we supply our own embeddings). Excluded everywhere.
exclude-dependencies = ["kubernetes", "onnxruntime"]

[dependency-groups]
dev = [
    "pytest",
    "pytest-asyncio",
    "ruff",
    "mypy",
    "ipykernel",
]
# Local corpus ingestion (PDF parsing); the served API never ingests.
ingest = ["pymupdf"]
# V2: the LangGraph agent loop and SSE streaming.
agent = ["langgraph", "sse-starlette"]

[tool.pytest.ini_options]
testpaths = ["tests", "eval"]
addopts = "-q"
asyncio_mode = "auto"
pythonpath = ["."]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.12"

# These ship no type stubs or py.typed marker; treat them as untyped.
[[tool.mypy.overrides]]
module = ["rank_bm25.*", "boto3.*", "botocore.*"]
ignore_missing_imports = true
