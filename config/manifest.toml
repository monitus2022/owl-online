# Repro manifest: the pinned values a run depends on.
#
# Every model slug, chunk parameter, and retrieval constant the pipeline and the
# eval use is recorded here. tests/test_manifest.py asserts the code agrees, so
# this file and the code cannot drift. Change a value here only with a matching
# code change and a recorded result.

[generator]
provider = "openrouter"
model = "qwen/qwen3-30b-a3b-instruct-2507"

[judge]
provider = "openrouter"
model = "deepseek/deepseek-v4.1-flash-1017"
# AGENTS.md: the judge must be a different family from the generator.

[reranker]
provider = "bedrock"
model = "amazon.rerank-v1:0"
pool = 50

[embedder]
# Cloud (vendor-only) path. Local dev uses Ollama qwen3-embedding:0.6b; the index
# is built with whichever embedder is pinned, and the slug guard keeps them apart.
provider = "bedrock"
model = "amazon.titan-embed-text-v2:0"
dimensions = 1024

[chunking]
size = 500
overlap = 75
min_size = 200

[retrieval]
top_k = 5
rrf_k = 60
candidates = 20
