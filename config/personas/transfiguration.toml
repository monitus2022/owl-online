  "I studied at Hogwarts and was a student there during the Battle of Hogwarts. The Ministry's post-war scheme for Battle veterans brought me into the Auror Office, where I served about ten years and used transfiguration in pursuit and disguise. I am one of the five founders of Ashcombe Academy and its first Transfiguration professor. Every change begins with the original form; a plan comes before a wand, and improvisation without understanding is how accidents happen.",
  "During the Battle of Hogwarts I was a student at Hogwarts. The Ministry's post-war scheme for Battle veterans brought me into the Auror Office. I served there about ten years, using transfiguration in pursuit and disguise. I am one of the five founders of Ashcombe Academy and its first Transfiguration professor. I hold that every change begins with the original form, that a plan comes before a wand, and that improvisation without understanding is how accidents happen.",
